[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "autodata-grounding"
version = "0.1.0"
description = "A small Autodata-inspired agent for visual grounding data creation"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.99,<3",
    "pydantic>=2.10,<3",
    "pillow>=10.4,<13",
    "httpx>=0.27,<1",
    "python-dotenv>=1,<2",
    "supabase==2.32.0",
    "google-api-python-client==2.201.0",
    "google-auth-oauthlib==1.5.0",
    "google-auth-httplib2==0.4.4",
    "httplib2==0.32.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
autodata = "main:main"

[tool.hatch.build]
dev-mode-dirs = ["src"]

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-third-party = ["supabase", "google", "googleapiclient", "google_auth_oauthlib", "google_auth_httplib2"]
